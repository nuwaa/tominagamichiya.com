{{- $meta := partial "seo/metadata.html" . -}}
<meta name="description" content="{{ $meta.description }}">
<meta property="og:title" content="{{ $meta.title }}">
<meta property="og:description" content="{{ $meta.description }}">
<meta property="og:url" content="{{ .Permalink }}">
<meta property="og:type" content="{{ $meta.type }}">
<meta property="og:site_name" content="{{ .Site.Title }}">
<meta property="og:image" content="{{ $meta.image.url }}">
<meta property="og:image:alt" content="{{ $meta.image.alt }}">
{{ with $meta.image.width }}<meta property="og:image:width" content="{{ . }}">{{ end }}
{{ with $meta.image.height }}<meta property="og:image:height" content="{{ . }}">{{ end }}
<meta name="twitter:card" content="{{ $meta.image.card }}">
<meta name="twitter:title" content="{{ $meta.title }}">
<meta name="twitter:description" content="{{ $meta.description }}">
<meta name="twitter:image" content="{{ $meta.image.url }}">
<meta name="twitter:image:alt" content="{{ $meta.image.alt }}">
{{ with .Site.Params.twitter }}<meta name="twitter:site" content="{{ . }}">{{ end }}
