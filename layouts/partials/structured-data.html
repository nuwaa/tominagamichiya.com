{{ if .IsPage }}
{{ $image := partial "seo/image.html" . }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "NewsArticle",
  "headline": {{ .Title | jsonify | safeJS }},
  "datePublished": "{{ .Date.Format "2006-01-02T15:04:05Z07:00" }}",
  "dateModified": "{{ .Lastmod.Format "2006-01-02T15:04:05Z07:00" }}",
  "author": { "@type": "Person", "name": {{ (or .Params.author .Site.Params.author | default "富永道也") | jsonify | safeJS }} },
  "publisher": {
    "@type": "Person",
    "name": {{ (.Site.Params.publisher | default .Site.Params.author | default "富永道也") | jsonify | safeJS }}
  },
  "mainEntityOfPage": { "@type": "WebPage", "@id": "{{ .Permalink }}" },
  "image": {{ $image.url | jsonify | safeJS }}
}
</script>
{{ end }}
