<!doctype html><html lang="ja"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}</title>

<link rel="canonical" href="{{ .Permalink }}">
{{ partial "seo/opengraph.html" . }}
<link rel="alternate" type="application/rss+xml" title="{{ .Site.Title }}" href="{{ "index.xml" | absURL }}">
{{ if ne .Layout "profile" }}{{ partial "structured-data.html" . }}{{ end }}
<link rel="stylesheet" href="/css/custom.css">
{{ partial "ga.html" . }}
</head>
<body>
<a class="skip-link" href="#main-content">本文へ移動</a>
{{ partial "header.html" . }}
<main id="main-content" class="site-main" tabindex="-1">{{ block "main" . }}{{ end }}</main>
{{ partial "footer.html" . }}
</body></html>
